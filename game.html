<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Baldus Corp Craft Runner - Ultimate Edition</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #252526;
            padding: 15px;
            border: 4px solid #3c3c3c;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border-radius: 6px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 750px;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #4ec9b0;
            letter-spacing: 1px;
        }
        canvas {
            background: #ffffff;
            border: 3px solid #535353;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.05);
            border-radius: 2px;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #858585;
            text-align: center;
            max-width: 750px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hud">
            <span>BALDUS CORP - ULTIMATE RUN</span>
            <span>NIVEL: <span id="level">1</span></span>
            <span>PUNTOS: <span id="score">0</span></span>
            <span>MONEDAS: <span id="coins">0</span></span>
            <span>VIDAS: <span id="lives">❤️❤️❤️</span></span>
        </div>
        <canvas id="gameCanvas" width="750" height="300"></canvas>
        <div class="controls-hint">
            Usa <b>Espacio</b> o <b>↑</b> para saltar. Mantén presionado en el aire para caída suave. ¡Esquiva peligros, atrapa mejoras y acumula puntaje en este bucle infinito mejorado!
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Sistema de audio sintético avanzado retro
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.12);
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'powerup') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.25);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.08);
                gainNode.gain.setValueAtTime(0.07, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'hurt') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.35);
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            }
        }

        let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let coins = 0;
        let lives = 3;
        let gameSpeed = 6;
        let frameCount = 0;
        let currentLevel = 1;

        let player = {
            x: 80, y: 210, width: 28, height: 38,
            vy: 0, gravity: 0.6, jumpForce: -11, grounded: false, 
            invulnerable: 0, anim: 0, wingsTime: 0, shieldTime: 0, magnetTime: 0
        };

        let obstacles = [];
        let items = [];
        let sceneryElements = [];
        let particles = [];

        // Inicializar nubes de fondo y elementos ambientales estilo Google Dino refinado
        for (let i = 0; i < 6; i++) {
            sceneryElements.push({ 
                x: Math.random() * canvas.width, 
                y: Math.random() * 100 + 20, 
                speed: 0.5 + Math.random() * 1, 
                type: 'cloud' 
            });
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                if (gameState === "MENU") {
                    startGame();
                } else if (gameState === "PLAYING" && (player.grounded || player.wingsTime > 0)) {
                    player.vy = player.wingsTime > 0 ? -5.5 : player.jumpForce;
                    player.grounded = false;
                    playSound('jump');
                    createDustParticles();
                } else if (gameState === "GAMEOVER") {
                    startGame();
                }
            }
        });

        canvas.addEventListener("click", () => {
            if (gameState === "MENU") {
                startGame();
            } else if (gameState === "PLAYING" && (player.grounded || player.wingsTime > 0)) {
                player.vy = player.wingsTime > 0 ? -5.5 : player.jumpForce;
                player.grounded = false;
                playSound('jump');
                createDustParticles();
            } else if (gameState === "GAMEOVER") {
                startGame();
            }
        });

        function createDustParticles() {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: player.x + 10,
                    y: player.y + player.height,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -Math.random() * 2,
                    life: 20,
                    color: "#535353"
                });
            }
        }

        function startGame() {
            gameState = "PLAYING";
            obstacles = [];
            items = [];
            particles = [];
            score = 0;
            coins = 0;
            lives = 3;
            gameSpeed = 6;
            frameCount = 0;
            currentLevel = 1;
            player.y = 210;
            player.vy = 0;
            player.wingsTime = 0;
            player.shieldTime = 0;
            player.magnetTime = 0;
        }

        function loseLife() {
            if (player.invulnerable > 0) return;
            if (player.shieldTime > 0) {
                player.shieldTime = 0;
                player.invulnerable = 60;
                playSound('hurt');
                return;
            }
            lives--;
            playSound('hurt');
            player.invulnerable = 90;
            if (lives <= 0) {
                gameState = "GAMEOVER";
            }
        }

        function update() {
            if (gameState !== "PLAYING") return;

            frameCount++;
            score = Math.floor(frameCount / 6);
            currentLevel = Math.floor(score / 400) + 1;
            gameSpeed = 6 + Math.min(currentLevel * 0.8, 8);

            if (player.invulnerable > 0) player.invulnerable--;
            if (player.wingsTime > 0) player.wingsTime--;
            if (player.shieldTime > 0) player.shieldTime--;
            if (player.magnetTime > 0) player.magnetTime--;
            player.anim += 0.3;

            // Gravedad y Física de Vuelo / Salto
            if (player.wingsTime > 0) {
                player.vy += 0.15;
            } else {
                player.vy += player.gravity;
            }
            player.y += player.vy;

            // Suelo del juego fijo en Y = 210
            if (player.y > 210) {
                player.y = 210;
                player.vy = 0;
                player.grounded = true;
            }

            // Movimiento de nubes y elementos decorativos del fondo
            sceneryElements.forEach(item => {
                item.x -= item.speed;
                if (item.x < -60) {
                    item.x = canvas.width + 50;
                    item.y = Math.random() * 120 + 10;
                }
            });

            // Actualizar partículas de polvo
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // Generador Inteligente y Dinámico de Obstáculos Complejos
            let spawnInterval = Math.max(45, 100 - currentLevel * 8);
            if (frameCount % spawnInterval === 0) {
                let randType = Math.random();
                if (randType < 0.28) {
                    obstacles.push({ x: canvas.width, y: 215, width: 18, height: 32, type: 'cactus' });
                } else if (randType < 0.52) {
                    obstacles.push({ x: canvas.width, y: 208, width: 34, height: 40, type: 'dino' });
                } else if (randType < 0.72) {
                    obstacles.push({ x: canvas.width, y: 220, width: 28, height: 24, type: 'spider' });
                } else if (randType < 0.88) {
                    obstacles.push({ x: canvas.width, y: Math.random() > 0.5 ? 110 : 155, width: 30, height: 20, type: 'bird' });
                } else {
                    // Obstáculo doble en cadena
                    obstacles.push({ x: canvas.width, y: 215, width: 18, height: 32, type: 'cactus' });
                    obstacles.push({ x: canvas.width + 45, y: 215, width: 18, height: 32, type: 'cactus' });
                }
            }

            // Generador de Ítems especiales y Monedas Baldus
            if (frameCount % 180 === 0) {
                let itemRoll = Math.random();
                let itemType = 'coin';
                if (itemRoll > 0.82) itemType = 'heart';
                else if (itemRoll > 0.68) itemType = 'wings';
                else if (itemRoll > 0.55) itemType = 'shield';
                else if (itemRoll > 0.45) itemType = 'magnet';

                items.push({
                    x: canvas.width,
                    y: Math.random() > 0.4 ? 140 : 190,
                    width: 24, height: 24,
                    type: itemType
                });
            }

            // Actualización de Obstáculos y Colisiones
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;
                if (obstacles[i].type === 'bird') {
                    obstacles[i].x -= 1.8; // Las aves se desplazan más rápido
                }

                // Detección de colisión precisa caja por caja
                if (
                    player.x < obstacles[i].x + obstacles[i].width - 6 &&
                    player.x + player.width - 6 > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    loseLife();
                    obstacles.splice(i, 1);
                } else if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Actualización de Ítems e Imán de Monedas
            for (let i = items.length - 1; i >= 0; i--) {
                items[i].x -= gameSpeed;

                // Si el imán está activo, las monedas se acercan al jugador
                if (player.magnetTime > 0 && items[i].type === 'coin') {
                    let dx = player.x - items[i].x;
                    let dy = player.y - items[i].y;
                    items[i].x += dx * 0.08;
                    items[i].y += dy * 0.08;
                }

                if (
                    player.x < items[i].x + items[i].width &&
                    player.x + player.width > items[i].x &&
                    player.y < items[i].y + items[i].height &&
                    player.y + player.height > items[i].y
                ) {
                    if (items[i].type === 'heart') {
                        if (lives < 5) lives++;
                        playSound('powerup');
                    } else if (items[i].type === 'wings') {
                        player.wingsTime = 320;
                        playSound('powerup');
                    } else if (items[i].type === 'shield') {
                        player.shieldTime = 400;
                        playSound('powerup');
                    } else if (items[i].type === 'magnet') {
                        player.magnetTime = 350;
                        playSound('powerup');
                    } else if (items[i].type === 'coin') {
                        coins += 5;
                        playSound('coin');
                    }
                    items.splice(i, 1);
                } else if (items[i].x + items[i].width < 0) {
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Nubes ambientales del fondo estilo minimalista pixel
            ctx.fillStyle = "rgba(83, 83, 83, 0.12)";
            sceneryElements.forEach(item => {
                if (item.type === 'cloud') {
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, 12, 0, Math.PI * 2);
                    ctx.arc(item.x + 14, item.y - 4, 16, 0, Math.PI * 2);
                    ctx.arc(item.x + 28, item.y, 12, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Letrero corporativo dinámico de fondo: BALDUS CORP
            let marcaX = (1800 - (frameCount * 1.6) % 2100);
            ctx.fillStyle = "rgba(83, 83, 83, 0.07)";
            ctx.font = "bold 52px 'Courier New', monospace";
            ctx.fillText("BALDUS CORP", marcaX, 90);

            // Línea de suelo estricta estilo runner clásico
            ctx.fillStyle = "#535353";
            ctx.fillRect(0, 248, canvas.width, 3);

            // Dibujar Partículas de Polvo
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
            });

            // Dibujar Obstáculos detallados y variados
            for (let obs of obstacles) {
                if (obs.type === 'cactus') {
                    ctx.fillStyle = "#535353";
                    ctx.fillRect(obs.x + 6, obs.y, 6, 33);
                    ctx.fillRect(obs.x, obs.y + 10, 18, 5);
                } else if (obs.type === 'dino') {
                    ctx.fillStyle = "#535353";
                    ctx.fillRect(obs.x + 4, obs.y + 8, 26, 26);
                    ctx.fillRect(obs.x, obs.y + 16, 10, 14);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(obs.x + 4, obs.y + 11, 3, 3);
                } else if (obs.type === 'spider') {
                    ctx.fillStyle = "#535353";
                    ctx.fillRect(obs.x + 4, obs.y + 8, 20, 12);
                    ctx.strokeStyle = "#535353";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 4, obs.y + 20); ctx.lineTo(obs.x - 2, obs.y + 26);
                    ctx.moveTo(obs.x + 24, obs.y + 20); ctx.lineTo(obs.x + 30, obs.y + 26);
                    ctx.stroke();
                } else if (obs.type === 'bird') {
                    ctx.fillStyle = "#535353";
                    let wingFlap = Math.sin(frameCount * 0.35) * 7;
                    ctx.fillRect(obs.x + 2, obs.y + 6, 26, 8);
                    ctx.fillRect(obs.x + 10, obs.y + wingFlap, 10, 8);
                }
            }

            // Dibujar Ítems y Mejoras en el nivel
            for (let item of items) {
                if (item.type === 'heart') {
                    ctx.fillStyle = "#e11d48";
                    ctx.beginPath();
                    let hx = item.x + 12, hy = item.y + 12;
                    ctx.arc(hx - 6, hy, 7, Math.PI, 0, false);
                    ctx.arc(hx + 6, hy, 7, Math.PI, 0, false);
                    ctx.lineTo(hx, hy + 13);
                    ctx.fill();
                } else if (item.type === 'wings') {
                    ctx.fillStyle = "#0284c7";
                    ctx.fillRect(item.x + 2, item.y + 6, 20, 12);
                    ctx.fillStyle = "#38bdf8";
                    ctx.fillRect(item.x + 7, item.y + 2, 10, 6);
                } else if (item.type === 'shield') {
                    ctx.fillStyle = "#d97706";
                    ctx.beginPath();
                    ctx.arc(item.x + 12, item.y + 12, 11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#fef3c7";
                    ctx.fillRect(item.x + 9, item.y + 6, 6, 12);
                } else if (item.type === 'magnet') {
                    ctx.fillStyle = "#7c3aed";
                    ctx.fillRect(item.x + 4, item.y + 4, 16, 16);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(item.x + 8, item.y + 8, 8, 8);
                } else if (item.type === 'coin') {
                    ctx.fillStyle = "#ca8a04";
                    ctx.beginPath();
                    ctx.arc(item.x + 12, item.y + 12, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#fef08a";
                    ctx.beginPath();
                    ctx.arc(item.x + 12, item.y + 12, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Dibujar Sprite del Personaje Principal (Estilo Minecraft de lado con animación completa)
            if (gameState === "PLAYING" || gameState === "GAMEOVER") {
                if (player.invulnerable % 4 < 2) {
                    let px = player.x;
                    let py = player.y;

                    // Efectos visuales externos según potenciadores activos
                    if (player.wingsTime > 0) {
                        ctx.fillStyle = "#0284c7";
                        ctx.fillRect(px - 8, py + 12, 8, 16);
                    }
                    if (player.shieldTime > 0) {
                        ctx.strokeStyle = "#fbbf24";
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(px + 14, py + 18, 24, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Cabeza perfil de Minecraft
                    ctx.fillStyle = "#535353";
                    ctx.fillRect(px + 4, py, 18, 16);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(px + 16, py + 6, 3, 3);

                    // Torso y Camisa
                    ctx.fillStyle = "#535353";
                    ctx.fillRect(px + 6, py + 16, 14, 12);

                    // Piernas dinámicas simulando carrera lateral
                    let legAnim = player.grounded ? Math.sin(player.anim) * 6 : 0;
                    ctx.fillStyle = "#535353";
                    ctx.fillRect(px + 6, py + 28, 5, 10 + legAnim);
                    ctx.fillRect(px + 15, py + 28, 5, 10 - legAnim);
                }
            }

            // Pantalla de Inicio / Menú Principal Extendido con Guía Interactiva
            if (gameState === "MENU") {
                ctx.fillStyle = "rgba(255, 255, 255, 0.97)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#333333";
                ctx.font = "bold 20px 'Courier New', monospace";
                ctx.fillText("BALDUS CORP - MANUAL DE OPERACIONES", 115, 32);

                ctx.font = "12px 'Courier New', monospace";
                ctx.fillStyle = "#e11d48";
                ctx.fillText("❤️ Corazón Rojo: Recupera 1 vida (Máximo 5).", 60, 75);
                ctx.fillStyle = "#0284c7";
                ctx.fillText("🪽 Alas Azules: Vuelo asistido durante 5 segundos.", 60, 105);
                ctx.fillStyle = "#d97706";
                ctx.fillText("🛡️ Escudo de Oro: Inmunidad temporal ante impactos.", 60, 135);
                ctx.fillStyle = "#7c3aed";
                ctx.fillText("🧲 Imán Púrpura: Atrae monedas automáticamente.", 60, 165);
                ctx.fillStyle = "#ca8a04";
                ctx.fillText("🟡 Moneda Baldus: Incrementa tu puntaje y capital.", 60, 195);

                ctx.font = "bold 13px 'Courier New', monospace";
                ctx.fillStyle = "#000000";
                ctx.fillText("¡Presiona ESPACIO o haz CLICK para INICIAR EL JUEGO!", 100, 250);
            }

            // Pantalla de Game Over
            if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#535353";
                ctx.font = "bold 22px 'Courier New', monospace";
                ctx.fillText("J U E G O   T E R M I N A D O", 195, 115);
                
                ctx.font = "14px 'Courier New', monospace";
                ctx.fillText("Puntaje Final: " + score + "  |  Monedas: " + coins, 230, 150);

                ctx.font = "bold 13px 'Courier New', monospace";
                ctx.fillText("Presiona ESPACIO para reiniciar la simulación", 185, 190);
            }

            // Actualización de elementos en pantalla HUD superior
            document.getElementById("score").innerText = score;
            document.getElementById("coins").innerText = coins;
            document.getElementById("level").innerText = currentLevel;

            let heartsDisplay = "";
            for (let i = 0; i < lives; i++) heartsDisplay += "❤️";
            if (player.wingsTime > 0) heartsDisplay += " 🪽";
            if (player.shieldTime > 0) heartsDisplay += " 🛡️";
            if (player.magnetTime > 0) heartsDisplay += " 🧲";
            document.getElementById("lives").innerHTML = heartsDisplay;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
