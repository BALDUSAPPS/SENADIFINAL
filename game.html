<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Baldus Corp Infinite Runner</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 420px;
            overflow: hidden;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        canvas {
            background: linear-gradient(to bottom, #1e293b 0%, #334155 70%, #0f172a 70%);
            border: 2px solid #3b82f6;
            box-shadow: 0px 0px 20px rgba(59, 130, 246, 0.4);
            border-radius: 4px;
        }
        .controls-hint {
            margin-top: 6px;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="hud">
        <span>BALDUS CORP - INFINITE RUN</span>
        <span>PUNTOS: <span id="score">0</span></span>
        <span>VIDAS: <span id="lives">❤️❤️❤️</span></span>
    </div>
    <canvas id="gameCanvas" width="600" height="250"></canvas>
    <div class="controls-hint">Usa la <b>Barra Espaciadora</b> o <b>↑</b> para saltar los obstáculos. ¡Atrapa corazones para más vidas!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Sistema de audio retro
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'heart') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'hurt') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        let score = 0;
        let lives = 3;
        let gameSpeed = 5;
        let frameCount = 0;
        let isGameOver = false;

        // Jugador estilo pixel art runner
        let player = {
            x: 60, y: 175, width: 26, height: 30,
            vy: 0, gravity: 0.7, jumpForce: -11, grounded: false, invulnerable: 0, anim: 0
        };

        let obstacles = [];
        let hearts = [];
        let particles = [];
        let clouds = [];

        // Inicializar algunas nubes de fondo
        for (let i = 0; i < 5; i++) {
            clouds.push({ x: Math.random() * canvas.width, y: Math.random() * 80 + 10, speed: 1 + Math.random() * 1.5 });
        }

        window.addEventListener("keydown", (e) => {
            if ((e.code === "Space" || e.code === "ArrowUp") && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
                playSound('jump');
            }
            if (isGameOver && (e.code === "Space" || e.code === "Enter")) {
                resetGame();
            }
        });

        canvas.addEventListener("click", () => {
            if (player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
                playSound('jump');
            }
            if (isGameOver) resetGame();
        });

        function resetGame() {
            obstacles = [];
            hearts = [];
            particles = [];
            score = 0;
            lives = 3;
            gameSpeed = 5;
            frameCount = 0;
            isGameOver = false;
            player.y = 175;
            player.vy = 0;
        }

        function loseLife() {
            if (player.invulnerable > 0) return;
            lives--;
            playSound('hurt');
            player.invulnerable = 90;
            if (lives <= 0) {
                isGameOver = true;
            }
        }

        function update() {
            if (isGameOver) return;

            frameCount++;
            score = Math.floor(frameCount / 8);
            gameSpeed = 5 + Math.floor(score / 250); // Aumenta dificultad progresivamente

            if (player.invulnerable > 0) player.invulnerable--;
            player.anim += 0.2;

            // Gravedad
            player.vy += player.gravity;
            player.y += player.vy;

            if (player.y > 175) {
                player.y = 175;
                player.vy = 0;
                player.grounded = true;
            }

            // Nubes en movimiento
            clouds.forEach(c => {
                c.x -= c.speed * 0.5;
                if (c.x < -60) c.x = canvas.width + 50;
            });

            // Generación infinita y aleatoria de obstáculos (estilo cactus/bloques futuristas)
            if (frameCount % Math.max(45, 110 - Math.floor(score / 20)) === 0) {
                let type = Math.random();
                if (type < 0.6) {
                    // Obstáculo bajo normal
                    obstacles.push({ x: canvas.width, y: 180, width: 22, height: 25, type: 'block' });
                } else if (type < 0.85) {
                    // Obstáculo alto
                    obstacles.push({ x: canvas.width, y: 145, width: 24, height: 60, type: 'tall' });
                } else {
                    // Obstáculo doble
                    obstacles.push({ x: canvas.width, y: 180, width: 20, height: 25, type: 'block' });
                    obstacles.push({ x: canvas.width + 35, y: 180, width: 20, height: 25, type: 'block' });
                }
            }

            // Generación aleatoria de corazones para recuperar vidas
            if (frameCount % 300 === 0 && Math.random() > 0.3) {
                hearts.push({ x: canvas.width, y: Math.random() > 0.5 ? 120 : 150, width: 20, height: 20 });
            }

            // Actualizar obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                // Colisión con jugador
                if (
                    player.x < obstacles[i].x + obstacles[i].width - 4 &&
                    player.x + player.width - 4 > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    loseLife();
                    obstacles.splice(i, 1);
                } else if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Actualizar corazones
            for (let i = hearts.length - 1; i >= 0; i--) {
                hearts[i].x -= gameSpeed;

                // Colisión con jugador para sumar vida
                if (
                    player.x < hearts[i].x + hearts[i].width &&
                    player.x + player.width > hearts[i].x &&
                    player.y < hearts[i].y + hearts[i].height &&
                    player.y + player.height > hearts[i].y
                ) {
                    if (lives < 5) lives++;
                    playSound('heart');
                    hearts.splice(i, 1);
                } else if (hearts[i].x + hearts[i].width < 0) {
                    hearts.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Nubes de fondo
            ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
                ctx.arc(c.x + 12, c.y - 4, 16, 0, Math.PI * 2);
                ctx.arc(c.x + 24, c.y, 12, 0, Math.PI * 2);
                ctx.fill();
            });

            // Letrero dinámico en el fondo que pasa cada cierto tiempo: "BALDUS CORP"
            let marcaX = (1500 - (frameCount * 1.5) % 1800);
            ctx.fillStyle = "rgba(59, 130, 246, 0.12)";
            ctx.font = "bold 42px 'Segoe UI', sans-serif";
            ctx.fillText("BALDUS CORP", marcaX, 90);

            // Suelo pixelado con líneas retro
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 205, canvas.width, 45);
            ctx.fillStyle = "#3b82f6";
            ctx.fillRect(0, 205, canvas.width, 3);

            // Dibujar Obstáculos (Diseño detallado tipo bloque cibernético / cactus pixel)
            for (let obs of obstacles) {
                ctx.fillStyle = "#ef4444";
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = "#b91c1c";
                ctx.fillRect(obs.x + 2, obs.y + 2, obs.width - 4, 4);
            }

            // Dibujar Corazones (Vidas extra)
            for (let h of hearts) {
                ctx.fillStyle = "#ec4899";
                ctx.beginPath();
                let hx = h.x + 10, hy = h.y + 10;
                ctx.arc(hx - 5, hy, 6, Math.PI, 0, false);
                ctx.arc(hx + 5, hy, 6, Math.PI, 0, false);
                ctx.lineTo(hx, hy + 12);
                ctx.fill();
            }

            // Dibujar Jugador (Sprite animado pixel art)
            if (player.invulnerable % 4 < 2) {
                let px = player.x;
                let py = player.y;

                // Cuerpo / Traje
                ctx.fillStyle = "#2563eb";
                ctx.fillRect(px + 4, py + 10, 18, 14);

                // Cabeza y Gorra Baldus
                ctx.fillStyle = "#38bdf8";
                ctx.fillRect(px + 3, py + 2, 18, 9);
                ctx.fillStyle = "#1d4ed8";
                ctx.fillRect(px + (player.vy !== 0 ? 2 : 5), py, 14, 4);

                // Piernas con animación de carrera
                let legOffset = player.grounded ? Math.sin(player.anim) * 5 : 0;
                ctx.fillStyle = "#1e293b";
                ctx.fillRect(px + 5, py + 24, 6, 6 + legOffset);
                ctx.fillRect(px + 15, py + 24, 6, 6 - legOffset);
            }

            // Actualizar HUD
            document.getElementById("score").innerText = score;
            let heartsStr = "";
            for (let i = 0; i < lives; i++) heartsStr += "❤️";
            document.getElementById("lives").innerHTML = heartsStr;

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 18px Segoe UI";
                ctx.fillText("¡GAME OVER! Presiona ESPACIO para reintentar", 80, 120);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
