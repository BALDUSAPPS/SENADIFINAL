<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Baldus Corp Craft Runner</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 420px;
            overflow: hidden;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        canvas {
            background: linear-gradient(to bottom, #1e293b 0%, #334155 70%, #0f172a 70%);
            border: 2px solid #3b82f6;
            box-shadow: 0px 0px 20px rgba(59, 130, 246, 0.4);
            border-radius: 4px;
        }
        .controls-hint {
            margin-top: 6px;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="hud">
        <span>BALDUS CORP - CRAFT RUN</span>
        <span>PUNTOS: <span id="score">0</span></span>
        <span>VIDAS: <span id="lives">❤️❤️❤️</span></span>
    </div>
    <canvas id="gameCanvas" width="600" height="250"></canvas>
    <div class="controls-hint">Usa <b>Espacio</b> o <b>↑</b> para saltar. ¡Atrapa corazones y alas para volar!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'powerup') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(700, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'hurt') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let lives = 3;
        let gameSpeed = 5;
        let frameCount = 0;

        let player = {
            x: 60, y: 170, width: 24, height: 32,
            vy: 0, gravity: 0.65, jumpForce: -10.5, grounded: false, invulnerable: 0, anim: 0, wingsTime: 0
        };

        let obstacles = [];
        let items = [];
        let clouds = [];

        for (let i = 0; i < 5; i++) {
            clouds.push({ x: Math.random() * canvas.width, y: Math.random() * 80 + 10, speed: 1 + Math.random() * 1.5 });
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                if (gameState === "MENU") {
                    startGame();
                } else if (gameState === "PLAYING" && (player.grounded || player.wingsTime > 0)) {
                    player.vy = player.wingsTime > 0 ? -6 : player.jumpForce;
                    player.grounded = false;
                    playSound('jump');
                } else if (gameState === "GAMEOVER") {
                    startGame();
                }
            }
        });

        canvas.addEventListener("click", () => {
            if (gameState === "MENU") {
                startGame();
            } else if (gameState === "PLAYING" && (player.grounded || player.wingsTime > 0)) {
                player.vy = player.wingsTime > 0 ? -6 : player.jumpForce;
                player.grounded = false;
                playSound('jump');
            } else if (gameState === "GAMEOVER") {
                startGame();
            }
        });

        function startGame() {
            gameState = "PLAYING";
            obstacles = [];
            items = [];
            score = 0;
            lives = 3;
            gameSpeed = 5;
            frameCount = 0;
            player.y = 170;
            player.vy = 0;
            player.wingsTime = 0;
        }

        function loseLife() {
            if (player.invulnerable > 0 || player.wingsTime > 0) return;
            lives--;
            playSound('hurt');
            player.invulnerable = 90;
            if (lives <= 0) {
                gameState = "GAMEOVER";
            }
        }

        function update() {
            if (gameState !== "PLAYING") return;

            frameCount++;
            score = Math.floor(frameCount / 8);
            gameSpeed = 5 + Math.floor(score / 300);

            if (player.invulnerable > 0) player.invulnerable--;
            if (player.wingsTime > 0) player.wingsTime--;
            player.anim += 0.25;

            if (player.wingsTime > 0) {
                player.vy += 0.2; // Gravedad reducida al volar con alas
            } else {
                player.vy += player.gravity;
            }
            
            player.y += player.vy;

            if (player.y > 170) {
                player.y = 170;
                player.vy = 0;
                player.grounded = true;
            }

            clouds.forEach(c => {
                c.x -= c.speed * 0.5;
                if (c.x < -60) c.x = canvas.width + 50;
            });

            // Generación de obstáculos variados (Cactus, Dinosaurios, Arañas, Aves)
            if (frameCount % Math.max(50, 110 - Math.floor(score / 25)) === 0) {
                let rand = Math.random();
                if (rand < 0.3) {
                    obstacles.push({ x: canvas.width, y: 175, width: 20, height: 25, type: 'cactus' });
                } else if (rand < 0.6) {
                    obstacles.push({ x: canvas.width, y: 170, width: 30, height: 30, type: 'dino' });
                } else if (rand < 0.8) {
                    obstacles.push({ x: canvas.width, y: 180, width: 26, height: 20, type: 'spider' });
                } else {
                    obstacles.push({ x: canvas.width, y: Math.random() > 0.5 ? 90 : 130, width: 28, height: 20, type: 'bird' });
                }
            }

            // Generación de ítems (Corazones y Alas)
            if (frameCount % 250 === 0) {
                items.push({ x: canvas.width, y: Math.random() > 0.5 ? 110 : 150, width: 22, height: 22, type: Math.random() > 0.4 ? 'heart' : 'wings' });
            }

            // Actualizar obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;
                if (obstacles[i].type === 'bird') obstacles[i].x -= 1.5; // Las aves vuelan más rápido

                if (
                    player.x < obstacles[i].x + obstacles[i].width - 4 &&
                    player.x + player.width - 4 > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    loseLife();
                    obstacles.splice(i, 1);
                } else if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // Actualizar ítems
            for (let i = items.length - 1; i >= 0; i--) {
                items[i].x -= gameSpeed;

                if (
                    player.x < items[i].x + items[i].width &&
                    player.x + player.width > items[i].x &&
                    player.y < items[i].y + items[i].height &&
                    player.y + player.height > items[i].y
                ) {
                    if (items[i].type === 'heart') {
                        if (lives < 5) lives++;
                    } else if (items[i].type === 'wings') {
                        player.wingsTime = 300; // ~5 segundos de vuelo
                    }
                    playSound('powerup');
                    items.splice(i, 1);
                } else if (items[i].x + items[i].width < 0) {
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Nubes de fondo
            ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
                ctx.arc(c.x + 12, c.y - 4, 16, 0, Math.PI * 2);
                ctx.arc(c.x + 24, c.y, 12, 0, Math.PI * 2);
                ctx.fill();
            });

            // Letrero dinámico en el cielo: BALDUS CORP
            let marcaX = (1600 - (frameCount * 1.5) % 1900);
            ctx.fillStyle = "rgba(59, 130, 246, 0.12)";
            ctx.font = "bold 44px 'Segoe UI', sans-serif";
            ctx.fillText("BALDUS CORP", marcaX, 85);

            // Suelo del juego
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 200, canvas.width, 50);
            ctx.fillStyle = "#3b82f6";
            ctx.fillRect(0, 200, canvas.width, 3);

            // Dibujar Obstáculos
            for (let obs of obstacles) {
                if (obs.type === 'cactus') {
                    ctx.fillStyle = "#16a34a";
                    ctx.fillRect(obs.x + 4, obs.y, 12, 25);
                    ctx.fillRect(obs.x, obs.y + 8, 20, 5);
                } else if (obs.type === 'dino') {
                    ctx.fillStyle = "#9333ea";
                    ctx.fillRect(obs.x + 5, obs.y + 6, 20, 18);
                    ctx.fillRect(obs.x, obs.y + 12, 8, 12); // Cabeza
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(obs.x + 2, obs.y + 14, 3, 3);
                } else if (obs.type === 'spider') {
                    ctx.fillStyle = "#0f172a";
                    ctx.fillRect(obs.x + 4, obs.y + 6, 18, 12);
                    ctx.strokeStyle = "#0f172a";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 6, obs.y + 18); ctx.lineTo(obs.x, obs.y + 24);
                    ctx.moveTo(obs.x + 20, obs.y + 18); ctx.lineTo(obs.x + 26, obs.y + 24);
                    ctx.stroke();
                } else if (obs.type === 'bird') {
                    ctx.fillStyle = "#ef4444";
                    let wingOffset = Math.sin(frameCount * 0.4) * 6;
                    ctx.fillRect(obs.x + 4, obs.y + 8, 20, 10);
                    ctx.fillRect(obs.x + 8, obs.y + wingOffset, 12, 6);
                }
            }

            // Dibujar Ítems (Corazones y Alas)
            for (let item of items) {
                if (item.type === 'heart') {
                    ctx.fillStyle = "#ec4899";
                    ctx.beginPath();
                    let hx = item.x + 11, hy = item.y + 11;
                    ctx.arc(hx - 5, hy, 6, Math.PI, 0, false);
                    ctx.arc(hx + 5, hy, 6, Math.PI, 0, false);
                    ctx.lineTo(hx, hy + 12);
                    ctx.fill();
                } else if (item.type === 'wings') {
                    ctx.fillStyle = "#38bdf8";
                    ctx.fillRect(item.x + 2, item.y + 6, 18, 10);
                    ctx.fillStyle = "#bae6fd";
                    ctx.fillRect(item.x + 6, item.y + 2, 10, 6);
                }
            }

            // Dibujar Personaje Estilo Minecraft de Lado (Corriendo)
            if (gameState === "PLAYING" || gameState === "GAMEOVER") {
                if (player.invulnerable % 4 < 2) {
                    let px = player.x;
                    let py = player.y;

                    // Si tiene alas activas, dibujarlas en la espalda
                    if (player.wingsTime > 0) {
                        ctx.fillStyle = "#38bdf8";
                        ctx.fillRect(px - 6, py + 10, 8, 14);
                    }

                    // Cabeza estilo pixel de Minecraft (de perfil)
                    ctx.fillStyle = "#f87171"; // Piel / Cara
                    ctx.fillRect(px + 4, py, 16, 14);
                    ctx.fillStyle = "#1e1b4b"; // Pelo / Gorra
                    ctx.fillRect(px + 4, py, 16, 5);
                    ctx.fillStyle = "#000000"; // Ojo
                    ctx.fillRect(px + 14, py + 5, 3, 3);

                    // Torso / Camisa
                    ctx.fillStyle = "#2563eb"; 
                    ctx.fillRect(px + 6, py + 14, 12, 10);

                    // Piernas animadas simulando carrera lateral
                    let legOffset = player.grounded ? Math.sin(player.anim) * 5 : 0;
                    ctx.fillStyle = "#1e293b";
                    ctx.fillRect(px + 6, py + 24, 4, 8 + legOffset);
                    ctx.fillRect(px + 14, py + 24, 4, 8 - legOffset);
                }
            }

            // Pantalla de Inicio (MENU)
            if (gameState === "MENU") {
                ctx.fillStyle = "rgba(11, 15, 25, 0.88)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#38bdf8";
                ctx.font = "bold 26px 'Segoe UI', sans-serif";
                ctx.fillText("BALDUS CORP RUNNER", 145, 100);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px 'Segoe UI', sans-serif";
                ctx.fillText("¡Presiona ESPACIO o haz Click para INICIAR JUEGO!", 100, 150);
            }

            // Pantalla de Game Over
            if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px Segoe UI";
                ctx.fillText("¡GAME OVER!", 230, 110);
                ctx.font = "14px Segoe UI";
                ctx.fillText("Presiona ESPACIO para JUGAR DE NUEVO", 165, 145);
            }

            document.getElementById("score").innerText = score;
            let heartsStr = "";
            for (let i = 0; i < lives; i++) heartsStr += "❤️";
            if (player.wingsTime > 0) heartsStr += " 🪽(Vuelo)";
            document.getElementById("lives").innerHTML = heartsStr;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
