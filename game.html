<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Baldus Bros - HD Arcade</title>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 420px;
            overflow: hidden;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        canvas {
            background: linear-gradient(to bottom, #38bdf8 0%, #cbd5e1 65%, #1e293b 65%);
            border: 2px solid #2563eb;
            box-shadow: 0px 0px 20px rgba(37, 99, 235, 0.4);
            border-radius: 4px;
        }
        .controls-hint {
            margin-top: 6px;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="hud">
        <span>BALDUS BROS - WORLD 1-1</span>
        <span>PUNTOS: <span id="score">0</span></span>
        <span>VIDAS: <span id="lives">❤️❤️❤️</span></span>
    </div>
    <canvas id="gameCanvas" width="600" height="250"></canvas>
    <div class="controls-hint">Usa las flechas <b>← →</b> para correr y <b>Espacio</b> / <b>↑</b> para saltar.</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Sistema de audio retro
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'stomp') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.12);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'hurt') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        let cameraX = 0;
        let score = 0;
        let lives = 3;
        let frameCount = 0;
        let isGameOver = false;
        let keys = {};

        let player = {
            x: 50, y: 155, width: 24, height: 30,
            vx: 0, vy: 0, speed: 3.5, jumpForce: -10, gravity: 0.5, grounded: false, facing: 'right', invulnerable: 0, animFrame: 0
        };

        let platforms = [
            { x: 0, y: 195, width: 3000, height: 55 },
            { x: 320, y: 130, width: 100, height: 16 },
            { x: 500, y: 95, width: 130, height: 16 },
            { x: 750, y: 130, width: 110, height: 16 },
            { x: 1000, y: 115, width: 120, height: 16 },
            { x: 1250, y: 130, width: 160, height: 16 }
        ];

        let scenery = [
            { type: 'cloud', x: 120, y: 35, w: 70, h: 25 },
            { type: 'cloud', x: 420, y: 20, w: 90, h: 30 },
            { type: 'cloud', x: 850, y: 40, w: 80, h: 25 },
            { type: 'cloud', x: 1250, y: 25, w: 95, h: 30 },
            { type: 'hill', x: 80, y: 145, w: 100, h: 50 },
            { type: 'hill', x: 600, y: 125, w: 130, h: 70 },
            { type: 'bush', x: 260, y: 179, w: 50, h: 16 },
            { type: 'bush', x: 700, y: 179, w: 60, h: 16 }
        ];

        let enemies = [
            { type: 'goomba', x: 380, y: 175, width: 22, height: 20, vx: -1.4, alive: true, anim: 0 },
            { type: 'koopa', x: 650, y: 171, width: 22, height: 24, vx: -1.1, alive: true, anim: 0 },
            { type: 'flyer', x: 850, y: 80, width: 24, height: 20, vx: -2, baseY: 80, alive: true },
            { type: 'goomba', x: 1100, y: 175, width: 22, height: 20, vx: -1.4, alive: true, anim: 0 },
            { type: 'flyer', x: 1400, y: 65, width: 24, height: 20, vx: -2.3, baseY: 65, alive: true }
        ];

        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if ((e.code === "Space" || e.code === "ArrowUp") && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
                playSound('jump');
            }
            if (isGameOver && (e.code === "Space" || e.code === "Enter")) {
                resetGame();
            }
        });

        window.addEventListener("keyup", (e) => {
            keys[e.code] = false;
        });

        function resetGame() {
            player.x = 50;
            player.y = 155;
            player.vx = 0;
            player.vy = 0;
            cameraX = 0;
            score = 0;
            lives = 3;
            isGameOver = false;
            enemies.forEach(e => e.alive = true);
        }

        function loseLife() {
            if (player.invulnerable > 0) return;
            lives--;
            playSound('hurt');
            player.invulnerable = 90;
            if (lives <= 0) {
                isGameOver = true;
            } else {
                player.y = 100;
                player.vy = 0;
            }
        }

        function update() {
            if (isGameOver) return;

            if (player.invulnerable > 0) player.invulnerable--;
            frameCount++;

            if (keys["ArrowLeft"] || keys["KeyA"]) {
                player.vx = -player.speed;
                player.facing = 'left';
                player.animFrame += 0.2;
            } else if (keys["ArrowRight"] || keys["KeyD"]) {
                player.vx = player.speed;
                player.facing = 'right';
                player.animFrame += 0.2;
            } else {
                player.vx = 0;
                player.animFrame = 0;
            }

            player.x += player.vx;
            if (player.x < 0) player.x = 0;

            cameraX = player.x - 180;
            if (cameraX < 0) cameraX = 0;

            player.vy += player.gravity;
            player.y += player.vy;
            player.grounded = false;

            for (let p of platforms) {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y + player.height >= p.y &&
                    player.y + player.height - player.vy <= p.y + 8 &&
                    player.vy >= 0
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }

            for (let en of enemies) {
                if (!en.alive) continue;

                if (en.type === 'flyer') {
                    en.x += en.vx;
                    en.y = en.baseY + Math.sin(frameCount * 0.1) * 35;
                    if (en.x < cameraX - 60) en.x = cameraX + 650;
                } else {
                    en.x += en.vx;
                    en.anim += 0.15;
                    if (en.x < 100 || en.x > 2500) en.vx *= -1;
                }

                if (
                    player.x < en.x + en.width &&
                    player.x + player.width > en.x &&
                    player.y < en.y + en.height &&
                    player.y + player.height > en.y
                ) {
                    if (player.vy > 0 && player.y + player.height - player.vy <= en.y + 12) {
                        en.alive = false;
                        player.vy = -8;
                        score += 250;
                        playSound('stomp');
                    } else {
                        loseLife();
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, 0);

            // Nubes detalladas
            for (let sc of scenery) {
                if (sc.type === 'cloud') {
                    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                    ctx.beginPath();
                    ctx.arc(sc.x, sc.y, sc.h/2, 0, Math.PI * 2);
                    ctx.arc(sc.x + sc.w*0.35, sc.y - 5, sc.h*0.65, 0, Math.PI * 2);
                    ctx.arc(sc.x + sc.w*0.75, sc.y, sc.h/2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Colinas y arbustos definidos
            for (let sc of scenery) {
                if (sc.type === 'hill') {
                    ctx.fillStyle = "#15803d";
                    ctx.beginPath();
                    ctx.arc(sc.x + sc.w/2, sc.y + sc.h, sc.w/2, Math.PI, 0, false);
                    ctx.fill();
                    // Anillo de brillo decorativo en la colina
                    ctx.strokeStyle = "#16a34a";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(sc.x + sc.w/2, sc.y + sc.h, sc.w/2 - 2, Math.PI * 0.8, Math.PI * 0.2, true);
                    ctx.stroke();
                } else if (sc.type === 'bush') {
                    ctx.fillStyle = "#166534";
                    ctx.beginPath();
                    ctx.arc(sc.x + 12, sc.y + 10, 11, 0, Math.PI * 2);
                    ctx.arc(sc.x + 28, sc.y + 4, 15, 0, Math.PI * 2);
                    ctx.arc(sc.x + 42, sc.y + 10, 11, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Suelo y plataformas estilizadas
            for (let p of platforms) {
                if (p.y > 150) {
                    ctx.fillStyle = "#b91c1c"; // Bloques de ladrillo
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = "#15803d"; // Capa de césped superior viva
                    ctx.fillRect(p.x, p.y, p.width, 10);
                    ctx.fillStyle = "#22c55e";
                    ctx.fillRect(p.x, p.y, p.width, 4);
                } else {
                    ctx.fillStyle = "#ea580c"; // Bloques flotantes misteriosos
                    ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.strokeStyle = "#7c2d12";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.width, p.height);
                }
            }

            // Enemigos animados con expresiones y movimiento
            for (let en of enemies) {
                if (!en.alive) continue;

                if (en.type === 'goomba') {
                    ctx.fillStyle = "#9a3412";
                    ctx.fillRect(en.x, en.y + 6, en.width, en.height - 6);
                    // Ojos enojados
                    ctx.fillStyle = "#fef08a";
                    ctx.fillRect(en.x + 2, en.y + 7, 6, 6);
                    ctx.fillRect(en.x + 14, en.y + 7, 6, 6);
                    ctx.fillStyle = "#000000";
                    ctx.fillRect(en.x + 5, en.y + 9, 2, 3);
                    ctx.fillRect(en.x + 17, en.y + 9, 2, 3);
                    // Patas animadas
                    let legStep = Math.sin(en.anim) > 0 ? 3 : 0;
                    ctx.fillStyle = "#451a03";
                    ctx.fillRect(en.x + 2, en.y + 18, 5, 4 + legStep);
                    ctx.fillRect(en.x + 15, en.y + 18, 5, 4 - legStep);
                } else if (en.type === 'koopa') {
                    ctx.fillStyle = "#15803d";
                    ctx.fillRect(en.x + 2, en.y + 8, 18, 16);
                    ctx.fillStyle = "#16a34a";
                    ctx.fillRect(en.x, en.y + 10, 22, 12);
                    ctx.fillStyle = "#fde047"; // Cabeza asomada
                    ctx.fillRect(en.x + (en.vx > 0 ? 16 : -4), en.y + 10, 8, 8);
                } else if (en.type === 'flyer') {
                    ctx.fillStyle = "#dc2626";
                    ctx.fillRect(en.x, en.y + 4, en.width, en.height - 4);
                    // Alas batiéndose rápido
                    ctx.fillStyle = "#ffffff";
                    let wingFlap = Math.sin(frameCount * 0.6) * 8;
                    ctx.fillRect(en.x - 10, en.y + wingFlap, 10, 6);
                    ctx.fillRect(en.x + 24, en.y + wingFlap, 10, 6);
                }
            }

            // Sprite del Jugador (Baldus Bros con animación fluida de piernas y gorra)
            if (player.invulnerable % 4 < 2) {
                let px = player.x;
                let py = player.y;

                // Gorra y camisa roja detallada
                ctx.fillStyle = "#b91c1c";
                ctx.fillRect(px + (player.facing === 'right' ? 4 : 2), py, 16, 9);
                ctx.fillRect(px + 2, py + 9, 20, 10);

                // Overol azul corporativo
                ctx.fillStyle = "#1d4ed8";
                ctx.fillRect(px + 4, py + 15, 16, 11);
                ctx.fillStyle = "#facc15"; // Botones dorados del overol
                ctx.fillRect(px + 5, py + 16, 2, 2);
                ctx.fillRect(px + 17, py + 16, 2, 2);

                // Piernas con animación al caminar
                let legCycle = Math.sin(player.animFrame) * 3;
                ctx.fillStyle = "#78350f";
                ctx.fillRect(px + 2, py + 26, 7, 4 + legCycle);
                ctx.fillRect(px + 15, py + 26, 7, 4 - legCycle);
            }

            ctx.restore();

            // Actualizar interfaz HUD
            document.getElementById("score").innerText = score;
            let hearts = "";
            for (let h = 0; h < lives; h++) hearts += "❤️";
            document.getElementById("lives").innerHTML = hearts;

            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 18px Segoe UI";
                ctx.fillText("¡GAME OVER! Presiona ESPACIO para reintentar", 80, 120);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
